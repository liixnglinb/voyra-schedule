name: Sync to Voyra

# 本仓库 push 后，把日程中心代码自动同步进 Voyra 主仓库并触发部署
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout voyra-schedule
        uses: actions/checkout@v4

      - name: Checkout Voyra main repo
        uses: actions/checkout@v4
        with:
          repository: liixnglinb/Voyra
          token: ${{ secrets.VOYRA_SYNC_TOKEN }}
          path: voyra

      - name: Sync files
        run: |
          for f in ScheduleHub ClassSchedule Planner; do
            cp "src/pages/$f.jsx" "voyra/src/pages/$f.jsx"
          done

      - name: Commit & push to Voyra
        run: |
          cd voyra
          git config user.name "voyra-schedule-sync[bot]"
          git config user.email "liixnglinb@users.noreply.github.com"
          git add src/pages/ScheduleHub.jsx src/pages/ClassSchedule.jsx src/pages/Planner.jsx
          if git diff --cached --quiet; then
            echo "无代码变更，跳过提交"
            exit 0
          fi
          git commit -m "chore(schedule): 自动同步自 voyra-schedule ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
